<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a2e"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <linearGradient id="pick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="512" x2="1024" y2="512" stroke="#1e3a5f" stroke-width="1.5" opacity="0.4"/>
  <line x1="512" y1="0" x2="512" y2="1024" stroke="#1e3a5f" stroke-width="1.5" opacity="0.4"/>

  <!-- Pickaxe icon (⛏ style) -->
  <!-- Handle -->
  <rect x="480" y="520" width="44" height="260" rx="22"
        fill="url(#pick)" opacity="0.9"
        transform="rotate(45 502 650)"/>

  <!-- Pickaxe head horizontal bar -->
  <rect x="200" y="290" width="480" height="80" rx="18" fill="url(#pick)"/>

  <!-- Left spike (sharp) -->
  <polygon points="200,290 160,330 200,370" fill="#3b82f6"/>

  <!-- Right spike (curved) -->
  <path d="M 680 290 Q 820 290 840 330 Q 820 370 680 370 Z" fill="#3b82f6"/>

  <!-- Letter G on a subtle circle -->
  <circle cx="512" cy="680" r="140" fill="#0f2240" stroke="#1e3a5f" stroke-width="2"/>
  <text x="512" y="726"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="140"
        font-weight="700"
        fill="#3b82f6"
        text-anchor="middle"
        letter-spacing="-4">G</text>
</svg>