name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: mac-arm
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            name: mac-intel
          - platform: windows-latest
            args: ''
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tauri App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Grubenberechnung ${{ github.ref_name }}'
          releaseBody: |
            ## Grubenberechnung ${{ github.ref_name }}

            ### Installation
            - **Windows**: `.msi` Datei herunterladen und ausführen
            - **Mac (Apple Silicon / M1–M4)**: `aarch64.dmg` herunterladen
            - **Mac (Intel)**: `x86_64.dmg` herunterladen

            ### Voraussetzungen
            - Gültiger Lizenzschlüssel erforderlich
            - Internetverbindung für Lizenzaktivierung
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
