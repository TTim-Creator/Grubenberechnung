name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: mac-arm
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            name: mac-intel
          - platform: windows-latest
            args: ''
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Abhängigkeiten installieren
        run: npm ci

      # ── Windows Code-Signing ─────────────────────────────────────────────────
      # Zertifikat aus GitHub Secret importieren (Base64-kodierte .pfx Datei)
      # Secret muss gesetzt sein: WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD
      - name: Windows Zertifikat importieren
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Tauri App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows Signing (nur aktiv wenn Secrets gesetzt)
          TAURI_SIGNING_WINDOWS_CERTIFICATE_FILE: ${{ env.CERT_PATH }}
          TAURI_SIGNING_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Grubenberechnung ${{ github.ref_name }}'
          releaseBody: |
            ## Grubenberechnung ${{ github.ref_name }}

            ### Installation
            - **Windows**: `.msi` Datei herunterladen und ausführen
            - **Mac (Apple Silicon / M1–M4)**: `_aarch64.dmg` herunterladen
            - **Mac (Intel)**: `_x86_64.dmg` herunterladen

            ### Voraussetzungen
            - Gültiger Lizenzschlüssel erforderlich
            - Internetverbindung für Lizenzaktivierung
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Zertifikat-Datei nach dem Build sicher löschen
      - name: Zertifikat aufräumen
        if: matrix.platform == 'windows-latest' && env.CERT_PATH != ''
        shell: pwsh
        run: |
          if (Test-Path $env:CERT_PATH) { Remove-Item $env:CERT_PATH -Force }
