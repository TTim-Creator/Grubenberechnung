name: CI

# Tests + Typecheck bei jedem Push/PR auf main.
# Release-Builds laufen ausschließlich über release.yml (Tag v*).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck + Frontend-Build
        run: npm run build

      - name: Tests ausführen
        run: npm run test:run

  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # tauri::generate_context! braucht den dist-Ordner zur Compile-Zeit
      - name: Frontend bauen
        run: npm ci && npm run build

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: System-Abhängigkeiten (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cargo Check + Tests
        working-directory: src-tauri
        run: |
          cargo check
          cargo test
